<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAIJID ALAM 🧑‍💻 | OFFICIAL CARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Card Container */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: 0.5s;
        }

        .card:hover {
            transform: translateY(-10px);
            border: 1px solid #00bcd4;
        }

        /* Profile Image */
        .profile-box {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .profile-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00bcd4;
            padding: 5px;
        }

        .online-status {
            position: absolute;
            bottom: 10px;
            right: 5px;
            width: 20px;
            height: 20px;
            background: #00ff00;
            border: 3px solid #1a1a1a;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
        }

        /* Text Styles */
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        p.bio {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Buttons Grid */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .link-item:hover {
            background: #00bcd4;
            color: #000;
            box-shadow: 0 0 20px #00bcd4;
            transform: scale(1.02);
        }

        /* Social Icons Row */
        .social-icons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons a {
            color: #fff;
            font-size: 20px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #00bcd4;
            transform: rotate(360deg);
        }

        footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="profile-box">
        <img src="https://i.postimg.cc/XYmcnZ1J/baijid-alam.jpg" alt="BAIJID ALAM 🧑‍💻">
        <div class="online-status"></div>
    </div>

    <h1>BAIJID ALAM 🧑‍💻</h1>
    <p class="bio">Digital Expert | DARK CYBER 2.5 TEAM Leader | Cyber Security Enthusiast</p>

    <div class="links-container">
        <a href="https://t.me/+qPKvzfv0c8BiMDY1" class="link-item">
            <span>MESSAGE ON TELEGRAM</span>
        </a>
        <a href="https://wa.me/qr/HFIIBHCRUENLE1" class="link-item">
            <span>CONTACT VIA WHATSAPP</span>
        </a>
        <a href="mailto:baijidalamallrafi@gmail.com" class="link-item">
            <span>SEND AN EMAIL</span>
        </a>
        <a href="https://www.facebook.com/share/1La2sKY8hK/"  class="link-item">
            <span>VISIT MY FB</span>
        </a>
    </div>

    <div class="social-icons">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
    </div>

    <footer>MADE BY BAIJID ALAM 🧑‍💻 &copy; 2026</footer>
</div>

</body>
</html>
