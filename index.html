<title>BAIJID ALAM Profile Card</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050a14;
    font-family:'Poppins',sans-serif;
}

#matrix{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050a14;
    z-index:0;
}

.rain{
    position:absolute;
    top:0;
    height:100vh;
    overflow:hidden;
    pointer-events:none;
}

.rain-track{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:flex;
    flex-direction:column;
    transform:translate3d(0,-50%,0);
    animation:matrixDown linear infinite;
    will-change:transform;
    backface-visibility:hidden;
}

@keyframes matrixDown{
    from{
        transform:translate3d(0,-50%,0);
    }
    to{
        transform:translate3d(0,0,0);
    }
}

.rain-stream{
    display:flex;
    flex-direction:column;
    width:100%;
    flex-shrink:0;
}

.rain-stream span{
    display:block;
    height:22px;
    line-height:22px;
    font-size:17px;
    font-weight:600;
    text-align:center;
    white-space:nowrap;
    padding:0;
    margin:0;
    color:rgba(57,255,136,.58);
    text-shadow:
        0 0 2px rgba(57,255,136,.40),
        0 0 5px rgba(57,255,136,.12);
    flex-shrink:0;
}

.rain-stream span:nth-child(3n){
    opacity:.82;
}

.rain-stream span:nth-child(5n){
    opacity:.70;
}

.rain-stream span:nth-child(7n){
    opacity:.56;
}

.rain-stream span:nth-child(11n){
    opacity:.44;
}

.rain-stream span:nth-child(17n){
    opacity:.32;
}

.rain-stream span:first-child{
    color:rgba(125,255,175,.72);
    text-shadow:
        0 0 3px rgba(98,255,156,.55),
        0 0 7px rgba(57,255,136,.22);
}

.names{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:5;
}

.name{
    position:absolute;
    color:#7affaa;
    font-family:monospace;
    font-size:19px;
    font-weight:800;
    letter-spacing:1px;
    white-space:nowrap;
    opacity:0;
    text-shadow:
        0 0 4px #7affaa,
        0 0 9px #39ff88,
        0 0 15px rgba(57,255,136,.60);
    animation:nameDown linear infinite;
    will-change:transform,opacity;
}

@keyframes nameDown{
    0%{
        transform:translate3d(0,-80px,0);
        opacity:0;
    }
    7%{
        opacity:1;
    }
    50%{
        opacity:1;
    }
    90%{
        opacity:.92;
    }
    100%{
        transform:translate3d(0,calc(100vh + 80px),0);
        opacity:0;
    }
}

#baijid-modal{
    display:flex;
    position:fixed;
    inset:0;
    background:transparent;
    z-index:20;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:auto;
}

#baijid-modal .card{
    background:rgba(255,255,255,.045);
    backdrop-filter:blur(8px) saturate(135%);
    -webkit-backdrop-filter:blur(8px) saturate(135%);
    border:1px solid rgba(255,255,255,.14);
    width:100%;
    max-width:400px;
    padding:40px 20px;
    border-radius:24px;
    text-align:center;
    box-shadow:
        0 8px 32px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.08);
    position:relative;
    z-index:30;
    animation:baijidCardIn .4s ease;
}

@keyframes baijidCardIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

#baijid-modal .baijid-close{
    position:absolute;
    top:12px;
    right:12px;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:none;
    color:#00ff88;
    font-size:26px;
    cursor:pointer;
    transition:.3s;
}

#baijid-modal .baijid-close:hover{
    color:#ff4444;
    transform:rotate(90deg);
}

#baijid-modal .profile-box{
    position:relative;
    width:120px;
    height:120px;
    margin:0 auto 20px;
}

#baijid-modal .profile-box img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(0,188,212,.6);
    padding:4px;
    box-shadow:
        0 0 20px rgba(0,255,136,.3);
}

#baijid-modal .online-status{
    position:absolute;
    bottom:12px;
    right:4px;
    width:18px;
    height:18px;
    background:#00ff88;
    border:3px solid rgba(0,0,0,.6);
    border-radius:50%;
    box-shadow:
        0 0 12px #00ff88;
}

#baijid-modal h1{
    font-family:'Orbitron',sans-serif;
    color:#00ff88;
    font-size:22px;
    letter-spacing:2px;
    margin:0 0 6px;
    text-shadow:
        0 0 12px rgba(0,255,136,.5);
}

#baijid-modal p.bio{
    color:#ff6b6b;
    font-size:13px;
    margin:0 0 25px;
}

#baijid-modal .links-container{
    display:flex;
    flex-direction:column;
    gap:14px;
}

#baijid-modal .link-item{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:rgba(255,255,255,.06);
    color:#00ffcc;
    text-decoration:none;
    padding:13px;
    border-radius:14px;
    font-weight:500;
    position:relative;
    z-index:1;
    transition:.3s;
    border:1px solid rgba(255,255,255,.1);
}

#baijid-modal .link-item::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:14px;
    padding:1.5px;
    background:
        linear-gradient(
            90deg,
            #ff0000,
            #ff7300,
            #fffb00,
            #48ff00,
            #00ffd5,
            #002bff,
            #7a00ff,
            #ff00c8,
            #ff0000
        );
    background-size:300% 300%;
    animation:baijidBorderMove 4s linear infinite;
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    z-index:-1;
}

@keyframes baijidBorderMove{
    0%{
        background-position:0% 50%;
    }
    100%{
        background-position:300% 50%;
    }
}

#baijid-modal .link-item:hover{
    background:rgba(0,255,200,.15);
    color:#fff;
    box-shadow:
        0 0 25px rgba(0,255,200,.3);
    transform:scale(1.03);
}

#baijid-modal .link-item:hover::before{
    animation:none;
    background:#00ffcc;
}

#baijid-modal .link-item i{
    font-size:18px;
}

#baijid-modal .social-icons{
    margin-top:28px;
    display:flex;
    justify-content:center;
    gap:28px;
}

#baijid-modal .social-icons a{
    color:rgba(255,255,255,.85);
    font-size:22px;
    transition:.35s;
}

#baijid-modal .social-icons a:hover{
    color:#00eaff;
    transform:
        rotate(360deg)
        scale(1.15);
    text-shadow:
        0 0 12px #00eaff;
}

#baijid-modal footer{
    margin-top:28px;
    color:#00ff88;
    font-size:12px;
    letter-spacing:1px;
    opacity:.85;
}

@media(max-width:480px){

    #baijid-modal{
        padding:12px;
    }

    #baijid-modal .card{
        max-width:360px;

    }

        font-size:20px;
    }

    #baijid-modal p.bio{

    }

    #baijid-modal .link-item{
        padding:12px 8px;
        font-size:13px;
    }

    .name{
        font-size:17px;
    }
}

</style>

<script>

const matrix =
    document.getElementById("matrix");

const columnWidth = 30;

const lineHeight = 22;

function createStream(){

    const stream =
        document.createElement("div");

    stream.className =
        "rain-stream";

    const count =
        Math.ceil(
            window.innerHeight /
            lineHeight
        ) + 20;

    const chars =
        "12345678900000000000aabcdkacskvslvjsjkshbskbsjksvjakvjwhs";

    for(let i = 0; i < count; i++){

        const span =
            document.createElement("span");

        span.textContent =
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

        stream.appendChild(span);
    }

    return stream;
}

function createMatrix(){

    matrix.innerHTML = "";

    const columns =
        Math.ceil(
            window.innerWidth /
            columnWidth
        );

    for(let i = 0; i < columns; i++){

        const rain =
            document.createElement("div");

        rain.className =
            "rain";

        rain.style.left =
            (i * columnWidth) + "px";

        rain.style.width =
            columnWidth + "px";

        const stream1 =
            createStream();

        const stream2 =
            stream1.cloneNode(true);

        const track =
            document.createElement("div");

        track.className =
            "rain-track";

        track.appendChild(stream1);

        track.appendChild(stream2);

        const duration =
            6.2 +
            Math.random() * 2.4;

        track.style.animationDuration =
            duration + "s";

        track.style.animationDelay =
            (-Math.random() * duration) + "s";

        rain.appendChild(track);

        matrix.appendChild(rain);
    }
}

createMatrix();

let resizeTimer;

window.addEventListener(
    "resize",
    () => {

        clearTimeout(resizeTimer);

        resizeTimer =
            setTimeout(
                createMatrix,
                250
            );
    }
);

</script>
